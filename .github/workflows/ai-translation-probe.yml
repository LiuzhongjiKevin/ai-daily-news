name: AI Alibaba Translation Probe

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Verify one public Hello. sample through the AI adapter; no email'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: world-finance-delivery
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/master' && inputs.confirm == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record tested source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check .
      - run: python -m pytest -m 'not live'

  probe:
    needs: verify
    if: github.ref == 'refs/heads/master' && inputs.confirm == true
    environment: ai-daily-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: world-finance-daily
          path: .translation-ledger
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-prod.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify AI adapter with six reserved units and no mail
        env:
          WORLD_FINANCE_ENVIRONMENT: ai-daily-production
          AI_ALIBABA_PROBE_APPROVED: 'true'
          WORLD_ALIBABA_TRANSLATION_ENABLED: 'true'
          WORLD_TRANSLATION_LEDGER_ANCHOR: ${{ vars.WORLD_TRANSLATION_LEDGER_ANCHOR }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          WORLD_FINANCE_STATE_TOKEN: ${{ secrets.AI_DAILY_STATE_TOKEN }}
        run: python -m ai_daily.ai_probe
