name: AI Daily Production

on:
  workflow_run:
    workflows: ["AI Daily Request"]
    types: [completed]
  schedule:
    - cron: "47 6 * * *"
      timezone: "Asia/Shanghai"
    - cron: "22 7 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read

concurrency:
  group: ai-daily-delivery
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.authority.outputs.trusted }}
      authorized_sha: ${{ steps.authority.outputs.authorized_sha }}
      mode: ${{ steps.request.outputs.mode }}
      send: ${{ steps.request.outputs.send || 'false' }}
      force: ${{ steps.request.outputs.force || 'false' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Verify production authority
        id: authority
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EXPECTED_TRIGGER_WORKFLOW_NAME: AI Daily Request
          EXPECTED_TRIGGER_WORKFLOW_PATH: .github/workflows/request.yml
          TRIGGER_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          TRIGGER_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: python scripts/check_production_authority.py
      - name: Parse trusted daily request
        id: request
        if: >-
          steps.authority.outputs.trusted == 'true' &&
          github.event_name == 'workflow_run'
        env:
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/parse_trusted_request.py daily

  cost_preview:
    needs: authorize
    if: >-
      needs.authorize.outputs.trusted == 'true' &&
      github.event_name == 'workflow_run' &&
      needs.authorize.outputs.send != 'true' &&
      needs.authorize.outputs.mode != 'off'
    runs-on: ubuntu-latest
    environment: ai-daily-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.authorized_sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-prod.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Run trusted cost preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ai-daily preview --ai-mode "${{ needs.authorize.outputs.mode }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ai-daily-cost-preview
          path: preview/
          if-no-files-found: warn

  daily:
    needs: authorize
    if: >-
      needs.authorize.outputs.trusted == 'true' &&
      ((github.event_name == 'schedule' && vars.AI_DAILY_SCHEDULE_ENABLED == 'true') ||
      (github.event_name == 'workflow_run' && needs.authorize.outputs.send == 'true'))
    runs-on: ubuntu-latest
    environment: ai-daily-production
    permissions:
      contents: read
    env:
      AI_DAILY_ATTEMPT_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      AUTHORIZED_SHA: ${{ needs.authorize.outputs.authorized_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.authorized_sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-prod.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify immutable default tip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_remote_default.py
      - name: Reserve delivery intent
        id: reserve
        if: needs.authorize.outputs.trusted == 'true'
        run: |
          force_arg=""
          if [ "${{ needs.authorize.outputs.force }}" = "true" ]; then
            force_arg="--force"
          fi
          ai-daily reserve-delivery --attempt-id "${AI_DAILY_ATTEMPT_ID}" ${force_arg}
      - name: Commit reserved intent
        if: >-
          needs.authorize.outputs.trusted == 'true' &&
          steps.reserve.outputs.reservation_status == 'reserved'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/state.json
          if git diff --cached --quiet; then
            echo "Refusing to send without a new local reservation." >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -Ev '^data/state\.json$' >/dev/null; then
            echo "Refusing to commit an unexpected reservation path." >&2
            exit 1
          fi
          git commit -m "chore: reserve AI daily delivery"
      - name: Push reserved intent
        if: >-
          needs.authorize.outputs.trusted == 'true' &&
          steps.reserve.outputs.reservation_status == 'reserved'
        env:
          AI_DAILY_STATE_TOKEN: ${{ secrets.AI_DAILY_STATE_TOKEN }}
        run: python scripts/push_production_state.py
      - name: Run daily digest
        id: digest
        if: >-
          needs.authorize.outputs.trusted == 'true' &&
          (steps.reserve.outputs.reservation_status == 'reserved' ||
          steps.reserve.outputs.reservation_status == 'already_sent')
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_TOKEN_KEY: ${{ secrets.MS_TOKEN_KEY }}
          OUTLOOK_SENDER: ${{ secrets.OUTLOOK_SENDER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          force_arg=""
          mode_arg="--ai-mode off"
          if [ "${{ needs.authorize.outputs.force }}" = "true" ]; then
            force_arg="--force"
          fi
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            mode_arg="--ai-mode ${{ needs.authorize.outputs.mode }}"
          fi
          ai-daily run --send --attempt-id "${AI_DAILY_ATTEMPT_ID}" ${mode_arg} ${force_arg}
      - name: Release unattempted intent
        id: cleanup
        if: >-
          always() &&
          needs.authorize.outputs.trusted == 'true' &&
          steps.reserve.outputs.reservation_status == 'reserved' &&
          steps.digest.outcome == 'failure' &&
          steps.digest.outputs.delivery_outcome == 'not_attempted'
        run: ai-daily release-delivery --attempt-id "${AI_DAILY_ATTEMPT_ID}"
      - name: Commit unattempted cleanup
        id: cleanup_commit
        if: >-
          always() &&
          needs.authorize.outputs.trusted == 'true' &&
          steps.cleanup.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/state.json
          if git diff --cached --quiet; then
            echo "No cleanup state changes to commit."
            exit 0
          fi
          if git diff --cached --name-only | grep -Ev '^data/state\.json$' >/dev/null; then
            echo "Refusing to commit an unexpected cleanup path." >&2
            exit 1
          fi
          git commit -m "chore: release unattempted AI daily delivery"
      - name: Push unattempted cleanup
        if: >-
          always() &&
          needs.authorize.outputs.trusted == 'true' &&
          steps.cleanup_commit.outcome == 'success'
        env:
          AI_DAILY_STATE_TOKEN: ${{ secrets.AI_DAILY_STATE_TOKEN }}
        run: python scripts/push_production_state.py
      - name: Commit accepted state
        id: accepted_commit
        if: >-
          always() &&
          needs.authorize.outputs.trusted == 'true' &&
          steps.digest.outcome == 'success' &&
          steps.digest.outputs.delivery_outcome == 'accepted'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/ digests/ data/microsoft-token.enc
          if git diff --cached --quiet; then
            echo "No durable state changes to commit."
            exit 0
          fi
          if git diff --cached --name-only | grep -Ev '^(data/|digests/)' >/dev/null; then
            echo "Refusing to commit an unexpected path." >&2
            exit 1
          fi
          git commit -m "chore: update AI daily state"
      - name: Push accepted state
        if: >-
          always() &&
          needs.authorize.outputs.trusted == 'true' &&
          steps.digest.outcome == 'success' &&
          steps.digest.outputs.delivery_outcome == 'accepted' &&
          steps.accepted_commit.outcome == 'success'
        env:
          AI_DAILY_STATE_TOKEN: ${{ secrets.AI_DAILY_STATE_TOKEN }}
        run: python scripts/push_production_state.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ai-daily-delivery-preview
          path: preview/
          if-no-files-found: warn
