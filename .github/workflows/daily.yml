name: AI Daily

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [full, economy, off]
        default: full
      send:
        type: boolean
        default: false
      force:
        type: boolean
        default: false
  schedule:
    - cron: "47 6 * * *"
      timezone: "Asia/Shanghai"
    - cron: "22 7 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: ai-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run daily digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_TOKEN_KEY: ${{ secrets.MS_TOKEN_KEY }}
          OUTLOOK_SENDER: ${{ secrets.OUTLOOK_SENDER }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.send }}" = "true" ]; then
              ai-daily run --send --ai-mode "${{ inputs.mode }}" ${{ inputs.force && '--force' || '' }}
            else
              ai-daily preview --ai-mode "${{ inputs.mode }}" ${{ inputs.force && '--force' || '' }}
            fi
          else
            ai-daily run --send
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ai-daily-preview
          path: preview/
          if-no-files-found: warn
      - name: Commit durable state
        if: github.event_name != 'workflow_dispatch' || inputs.send == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git add -- data/ digests/ data/microsoft-token.enc
          if git diff --cached --quiet; then
            echo "No durable state changes to commit."
            exit 0
          fi
          if git diff --cached --name-only | grep -Ev '^(data/|digests/)' >/dev/null; then
            echo "Refusing to commit an unexpected path." >&2
            exit 1
          fi
          git commit -m "chore: update AI daily state"
          git push origin HEAD:"${GITHUB_REF_NAME}"
