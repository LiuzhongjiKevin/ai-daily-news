name: Test QQ Email

on:
  repository_dispatch:
    types: [ai-daily-test-mail, ai-daily-send-once]

permissions:
  contents: read

concurrency:
  group: ai-daily-test-mail
  cancel-in-progress: false

jobs:
  test-mail:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: ai-daily-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-prod.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Send one labelled test email
        if: github.event.action == 'ai-daily-test-mail'
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/test_qq_delivery.py
      - name: Collect and send one real digest to both inboxes
        if: github.event.action == 'ai-daily-send-once'
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          MAIL_PROVIDER: qq
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/send_one_off_digest.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && github.event.action == 'ai-daily-send-once'
        with:
          name: one-off-digest-and-delivery-state
          path: |
            preview/
            digests/
          retention-days: 7
