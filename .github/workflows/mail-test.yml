name: Test QQ Email

on:
  repository_dispatch:
    types: [ai-daily-test-mail]

permissions:
  contents: read

concurrency:
  group: ai-daily-test-mail
  cancel-in-progress: false

jobs:
  test-mail:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: ai-daily-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-prod.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Send one labelled test email
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/test_qq_delivery.py
