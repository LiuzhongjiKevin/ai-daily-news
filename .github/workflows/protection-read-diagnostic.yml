name: Temporary Protection Read Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/master'
    strategy:
      matrix:
        include:
          - environment: world-finance-production
            state_secret: WORLD_FINANCE_STATE_TOKEN
          - environment: ai-daily-production
            state_secret: AI_DAILY_STATE_TOKEN
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read existing credential identity and protection metadata only
        env:
          STATE_READ_TOKEN: ${{ secrets[matrix.state_secret] }}
          BUILTIN_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          """Temporary read-only Actions diagnostic. Prints allowlisted metadata only."""
          import json
          import os
          import re
          import urllib.error
          import urllib.request


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          def request(path, token, payload=None):
              headers = {"Accept": "application/vnd.github+json", "User-Agent": "protection-read-diagnostic"}
              if token:
                  headers["Authorization"] = "Bearer " + token
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request("https://api.github.com" + path, data=data, headers=headers)
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              try:
                  with opener.open(req, timeout=10) as response:
                      return response.status, dict(response.headers), json.load(response)
              except urllib.error.HTTPError as error:
                  try:
                      body = json.load(error)
                  except Exception:
                      body = {}
                  return error.code, dict(error.headers), body
              except Exception:
                  return 0, {}, {}


          def report(label, token):
              repo = "/repos/LiuzhongjiKevin/ai-daily-news"
              output = {"credential": label, "present": bool(token)}
              if not token:
                  print("PROTECTION_DIAGNOSTIC " + json.dumps(output))
                  return
              status, _, body = request("/user", token)
              login = body.get("login") if isinstance(body, dict) else None
              output["identity_status"] = status
              output["login"] = login if isinstance(login, str) and re.fullmatch(r"[A-Za-z0-9-]{1,39}", login) else None
              output["credential_kind"] = (
                  "fine_grained_pat" if token.startswith("github_pat_") else
                  "classic_pat" if token.startswith("ghp_") else
                  "installation_token" if token.startswith("ghs_") else "other"
              )
              status, _, body = request(repo, token)
              output["repository_status"] = status
              perms = body.get("permissions", {}) if isinstance(body, dict) else {}
              output["repository_role"] = {key: perms.get(key) is True for key in ("admin", "push", "pull")}
              status, headers, body = request(repo + "/branches/world-finance-daily/protection", token)
              output["protection_status"] = status
              lowered = {k.lower(): v for k, v in headers.items()}
              output["requires_administration_read"] = "administration=read" in lowered.get("x-accepted-github-permissions", "")
              messages = {
                  "Resource not accessible by personal access token": "pat_permission_denied",
                  "Resource not accessible by integration": "integration_permission_denied",
                  "Must have admin rights to Repository.": "repository_admin_required",
                  "Bad credentials": "invalid_credential",
              }
              message = body.get("message") if isinstance(body, dict) else None
              output["protection_error"] = messages.get(message, "none" if status == 200 else "other")
              query = """query{repository(owner:"LiuzhongjiKevin",name:"ai-daily-news"){
                ref(qualifiedName:"refs/heads/world-finance-daily"){name branchProtectionRule{
                pattern isAdminEnforced allowsForcePushes allowsDeletions
                bypassForcePushAllowances(first:1){totalCount}}}}}"""
              status, _, body = request("/graphql", token, {"query": query})
              output["graphql_status"] = status
              errors = body.get("errors", []) if isinstance(body, dict) else []
              output["graphql_error_types"] = sorted({
                  e.get("type") if e.get("type") in {"FORBIDDEN", "NOT_FOUND", "UNAUTHORIZED", "RATE_LIMITED"} else "other"
                  for e in errors if isinstance(e, dict)
              })
              try:
                  rule = body["data"]["repository"]["ref"]["branchProtectionRule"]
                  output["complete_safe_rule"] = (
                      not errors and rule["pattern"] == "world-finance-daily"
                      and rule["isAdminEnforced"] is True and rule["allowsForcePushes"] is False
                      and rule["allowsDeletions"] is False
                      and type(rule["bypassForcePushAllowances"]["totalCount"]) is int
                      and rule["bypassForcePushAllowances"]["totalCount"] == 0
                  )
              except Exception:
                  output["complete_safe_rule"] = False
              print("PROTECTION_DIAGNOSTIC " + json.dumps(output, sort_keys=True))


          if __name__ == "__main__":
              report("state", os.environ.get("STATE_READ_TOKEN", ""))
              report("builtin", os.environ.get("BUILTIN_READ_TOKEN", ""))
          PY
