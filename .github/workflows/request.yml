name: AI Daily Request
run-name: ai-daily-request|mode=${{ github.event_name == 'workflow_dispatch' && 'off' || github.event.client_payload.mode }}|send=${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.send) || format('{0}', github.event.client_payload.send) }}|force=${{ github.event_name == 'workflow_dispatch' && 'false' || format('{0}', github.event.client_payload.force) }}|ref=${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.client_payload.target_ref }}

on:
  workflow_dispatch:
    inputs:
      send:
        description: '发送正式邮件（不勾选只预览；Branch 请选择 master；当天已发送则跳过）'
        type: boolean
        default: false
  repository_dispatch:
    types: [ai-daily-request]

permissions:
  contents: read

jobs:
  safe_preview:
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate repository dispatch
        id: request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/parse_repository_dispatch.py daily
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.request.outputs.target_ref }}
          path: target
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - run: python -m pip install --requirement requirements-prod.lock
        working-directory: target
      - run: python -m pip install --no-deps --no-build-isolation -e .
        working-directory: target
      - name: Run deterministic safe preview
        working-directory: target
        run: ai-daily preview --ai-mode off
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ai-daily-safe-preview
          path: target/preview/
          if-no-files-found: warn
