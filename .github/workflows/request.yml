name: AI Daily Request
run-name: ai-daily-request|mode=${{ inputs.mode }}|send=${{ inputs.send }}|force=${{ inputs.force }}|ref_type=${{ github.ref_type }}|ref=${{ github.ref }}

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [full, economy, off]
        default: full
      send:
        type: boolean
        default: false
      force:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  safe_preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-prod.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Run deterministic safe preview
        run: ai-daily preview --ai-mode off
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ai-daily-safe-preview
          path: preview/
          if-no-files-found: warn
