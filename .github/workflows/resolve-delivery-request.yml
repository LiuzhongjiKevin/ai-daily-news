name: Resolve AI Daily Delivery Request
run-name: ai-daily-resolve|date=${{ github.event.client_payload.date }}|resolution=${{ github.event.client_payload.resolution }}|message_id=${{ github.event.client_payload.message_id }}|confirm=${{ github.event.client_payload.confirm }}|ref=${{ github.event.client_payload.target_ref }}

on:
  repository_dispatch:
    types: [ai-daily-resolve]

permissions:
  contents: read

jobs:
  record_request:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate repository dispatch
        id: request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/parse_repository_dispatch.py resolve
      - name: Record read-only recovery request
        run: echo "Resolution request recorded for trusted default-branch processing."
