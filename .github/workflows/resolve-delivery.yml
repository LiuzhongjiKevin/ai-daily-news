name: Resolve AI Daily Delivery

on:
  workflow_dispatch:
    inputs:
      date:
        description: Beijing delivery date (YYYY-MM-DD)
        type: string
        required: true
      resolution:
        description: Mailbox-confirmed resolution
        type: choice
        options: [retry, sent]
        required: true
      message_id:
        description: Safe local fingerprint (required only for sent)
        type: string
        required: false
      confirm_owner_terminal:
        description: I confirmed the owning delivery run is terminal
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: ai-daily-delivery
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify centralized delivery ref
        id: delivery_ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/check_delivery_ref.py
      - name: Require trusted recovery context
        env:
          TRUSTED_REF: ${{ steps.delivery_ref.outputs.trusted }}
          OWNER_TERMINAL_CONFIRMED: ${{ inputs.confirm_owner_terminal }}
        run: |
          if [ "${TRUSTED_REF}" != "true" ] || [ "${OWNER_TERMINAL_CONFIRMED}" != "true" ]; then
            echo "Recovery requires the exact default branch and a terminal owner run." >&2
            exit 1
          fi
      - run: python -m pip install --requirement requirements-prod.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Resolve delivery state
        id: resolution
        if: >-
          steps.delivery_ref.outputs.trusted == 'true' &&
          inputs.confirm_owner_terminal == true
        env:
          DELIVERY_DATE: ${{ inputs.date }}
          RESOLUTION: ${{ inputs.resolution }}
          MESSAGE_ID: ${{ inputs.message_id }}
        run: |
          if [ "${RESOLUTION}" = "sent" ]; then
            if [ -z "${MESSAGE_ID}" ]; then
              echo "A safe message fingerprint is required for sent." >&2
              exit 1
            fi
            ai-daily resolve-delivery sent --date "${DELIVERY_DATE}" --message-id "${MESSAGE_ID}" --confirm-owner-terminal
          else
            if [ -n "${MESSAGE_ID}" ]; then
              echo "Retry does not accept a message fingerprint." >&2
              exit 1
            fi
            ai-daily resolve-delivery retry --date "${DELIVERY_DATE}" --confirm-owner-terminal
          fi
      - name: Commit resolved state
        if: >-
          steps.delivery_ref.outputs.trusted == 'true' &&
          inputs.confirm_owner_terminal == true &&
          steps.resolution.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git add -- data/state.json
          if git diff --cached --quiet; then
            echo "No delivery state changes to commit."
            exit 0
          fi
          if git diff --cached --name-only | grep -Ev '^data/state\.json$' >/dev/null; then
            echo "Refusing to commit an unexpected recovery path." >&2
            exit 1
          fi
          git commit -m "chore: resolve AI daily delivery"
          git push origin HEAD:"${GITHUB_REF_NAME}"
