name: Resolve AI Daily Delivery

on:
  workflow_run:
    workflows: ["Resolve AI Daily Delivery Request"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ai-daily-delivery
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.authority.outputs.trusted }}
      authorized_sha: ${{ steps.authority.outputs.authorized_sha }}
      date: ${{ steps.request.outputs.date }}
      resolution: ${{ steps.request.outputs.resolution }}
      message_id: ${{ steps.request.outputs.message_id }}
      confirm: ${{ steps.request.outputs.confirm }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Verify production authority
        id: authority
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EXPECTED_TRIGGER_WORKFLOW_NAME: Resolve AI Daily Delivery Request
          EXPECTED_TRIGGER_WORKFLOW_PATH: .github/workflows/resolve-delivery-request.yml
          TRIGGER_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          TRIGGER_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
          TRIGGER_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: python scripts/check_production_authority.py
      - name: Parse trusted resolution request
        id: request
        if: steps.authority.outputs.trusted == 'true'
        env:
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/parse_trusted_request.py resolve

  resolve:
    needs: authorize
    if: >-
      needs.authorize.outputs.trusted == 'true' &&
      needs.authorize.outputs.confirm == 'true'
    runs-on: ubuntu-latest
    environment: ai-daily-production
    permissions:
      contents: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      AUTHORIZED_SHA: ${{ needs.authorize.outputs.authorized_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.authorized_sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-prod.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify immutable default tip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_remote_default.py
      - name: Resolve delivery state
        id: resolution
        if: >-
          needs.authorize.outputs.trusted == 'true' &&
          needs.authorize.outputs.confirm == 'true'
        env:
          DELIVERY_DATE: ${{ needs.authorize.outputs.date }}
          RESOLUTION: ${{ needs.authorize.outputs.resolution }}
          MESSAGE_ID: ${{ needs.authorize.outputs.message_id }}
        run: |
          case "${RESOLUTION:-}" in
            retry)
              if [ -n "${MESSAGE_ID}" ]; then
                echo "Retry does not accept a message fingerprint." >&2
                exit 1
              fi
              ai-daily resolve-delivery retry --date "${DELIVERY_DATE}" --confirm-owner-terminal
              ;;
            sent)
              if [ -z "${MESSAGE_ID}" ]; then
                echo "A safe message fingerprint is required for sent." >&2
                exit 1
              fi
              ai-daily resolve-delivery sent --date "${DELIVERY_DATE}" --message-id "${MESSAGE_ID}" --confirm-owner-terminal
              ;;
            *)
              echo "Unsupported delivery resolution." >&2
              exit 1
              ;;
          esac
      - name: Commit resolved state
        if: >-
          needs.authorize.outputs.trusted == 'true' &&
          needs.authorize.outputs.confirm == 'true' &&
          steps.resolution.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/state.json
          if git diff --cached --quiet; then
            echo "No delivery state changes to commit."
            exit 0
          fi
          if git diff --cached --name-only | grep -Ev '^data/state\.json$' >/dev/null; then
            echo "Refusing to commit an unexpected recovery path." >&2
            exit 1
          fi
          git commit -m "chore: resolve AI daily delivery"
      - name: Push resolved state
        if: >-
          needs.authorize.outputs.trusted == 'true' &&
          needs.authorize.outputs.confirm == 'true' &&
          steps.resolution.outcome == 'success'
        env:
          AI_DAILY_STATE_TOKEN: ${{ secrets.AI_DAILY_STATE_TOKEN }}
        run: python scripts/push_production_state.py
