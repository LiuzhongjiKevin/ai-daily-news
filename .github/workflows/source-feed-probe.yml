name: Live Official Feed Probe

on:
  pull_request:
    paths:
      - config/sources.yaml
      - src/ai_daily/collectors/feed.py
      - scripts/probe_official_feeds.py
      - .github/workflows/source-feed-probe.yml

permissions:
  contents: read

jobs:
  live-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-prod.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Probe dated first-party Google feeds (no email or secrets)
        run: python scripts/probe_official_feeds.py
