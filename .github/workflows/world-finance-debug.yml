name: World Finance Debug Send

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '确认发送一封调试日报（可重复发送；可能消耗翻译额度；Branch 选 master）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: world-finance-delivery
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/master' && inputs.confirm == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: world-finance-daily
          persist-credentials: false
      - name: Record tested source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check .
      - run: python -m pytest -m 'not live'

  send:
    needs: verify
    if: github.ref == 'refs/heads/master' && inputs.confirm == true
    environment: world-finance-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-prod.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Send one debug digest without production state
        env:
          WORLD_FINANCE_ENVIRONMENT: world-finance-production
          WORLD_FINANCE_DEBUG_CONFIRM: ${{ inputs.confirm }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
        run: python -m ai_daily.world_debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: world-finance-debug
          path: world-debug/
          retention-days: 7
