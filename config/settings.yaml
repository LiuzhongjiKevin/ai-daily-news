timezone: Asia/Shanghai
ai_mode: "off"
ai_base_url: https://api.deepseek.com
ai_model: deepseek-v4-flash
ai_max_output_tokens: 2500
max_news_candidates: 12
# Score = trust (A25/B30/C12) + category (5-25) + recency (30 -> 0 over 36h)
# + 8 per extra publisher (max 16) - 30 for tutorial/customer-story/roundup titles.
# 40 keeps fresh official posts and categorized media stories for roughly a day, while an
# uncategorized single-media item survives only about eight hours.
min_news_score: 40
# Single-source clusters per source; stops one blog (e.g. AWS ML) filling the digest.
max_news_per_source: 3
github_top_n: 10
github_window_days: 7
snapshot_retention_days: 35
