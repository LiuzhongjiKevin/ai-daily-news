# Every domain below is controlled by the named company, except the explicit media
# discovery entries and the labelled community mirrors. Page selectors are source-shape
# contracts: a changed newsroom layout is surfaced as a source warning rather than guessed
# links or an empty success.
#
# Disabled 2026-10-29: every entry marked `enabled: false` without its own note failed in
# all 50 archived digests (2026-09-10..2026-10-29). Most are JS-rendered homepages where the
# generic `article` selector never matched, or publishers that answer GitHub runners with
# 403/429. Chinese vendor news is now covered through the zh media feeds further below.

# Title-only keyword gate for general tech feeds (`include_keywords`). ASCII keywords match
# whole words, so "ai" accepts "AI-powered" and "AI写作" but not "maintain".
ai_keywords: &ai_keywords [
  ai, a.i., artificial intelligence, machine learning, deep learning, neural, llm, llms,
  language model, foundation model, multimodal, generative, genai, agent, agents, agentic,
  chatbot, gpt, chatgpt, openai, anthropic, claude, gemini, deepmind, llama, mistral,
  deepseek, qwen, kimi, moonshot, glm, zhipu, minimax, grok, xai, copilot, cursor, codex,
  hugging face, huggingface, nvidia, gpu, gpus, diffusion, sora, midjourney, perplexity,
  人工智能, 大模型, 模型, 智能体, 生成式, 多模态, 机器学习, 深度学习, 算力, 具身智能,
  英伟达, 豆包, 文心, 通义, 千问, 混元, 智谱, 月之暗面, 阶跃, 百川, 讯飞星火, 商汤,
]
# Stricter gate for high-volume consumer feeds where nearly every gadget mentions "AI".
ai_core_keywords: &ai_core_keywords [
  artificial intelligence, llm, language model, foundation model, openai, anthropic, claude,
  gemini, deepmind, deepseek, qwen, kimi, glm, grok, chatgpt, gpt, copilot, nvidia,
  人工智能, 大模型, 智能体, 生成式, 多模态, 具身智能, 算力, 英伟达, 豆包, 文心, 通义, 千问, 混元,
  智谱, 月之暗面, 阶跃, 百川, 讯飞星火, 商汤,
]

