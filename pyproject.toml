[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-daily-news"
version = "0.1.0"
description = "Private AI daily runner; supported from an editable repository checkout."
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "cryptography>=45,<46",
  "feedparser>=6.0,<7",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "msal>=1.32,<2",
  "openai>=1.100,<2",
  "pydantic>=2.11,<3",
  "python-dateutil>=2.9,<3",
  "pyyaml>=6.0,<7",
  "rapidfuzz>=3.13,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7", "respx>=0.22,<1", "ruff>=0.12,<1"]

[project.scripts]
ai-daily = "ai_daily.cli:main"

[tool.pytest.ini_options]
addopts = "-q -m 'not live'"
testpaths = ["tests"]
markers = ["live: opt-in network validation for configured sources"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["src"]
